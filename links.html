<style>
:root{
  --red: #E3151A;
  --red-dark: #B5101A;
  --paper: #FBF4E9;
  --cream-dark: #F2E8D5;
  --ink: #2A211C;
  --ink-dim: #6b5e55;
  --line: #e8dfd1;
}
*{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body{ margin: 0; padding: 0; }
body{
  background: var(--paper); color: var(--ink);
  font-family: 'IBM Plex Mono', monospace; font-size: 0.95rem; line-height: 1.6;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex; flex-direction: column;
}

/* Vichy stripe top */
.vichy-top{
  height: 12px;
  background-image: repeating-linear-gradient(
    45deg,
    var(--red) 0,
    var(--red) 10px,
    var(--paper) 10px,
    var(--paper) 20px
  );
}

.wrap{
  max-width: 480px;
  width: 100%;
  margin: 0 auto;
  padding: 36px 24px 24px;
  flex: 1;
  display: flex;
  flex-direction: column;
}

/* Header */
.brand{
  text-align: center;
  margin-bottom: 28px;
}
.brand .logo-circle{
  width: 96px; height: 96px;
  margin: 0 auto 16px;
  background: var(--paper);
  border: 3px solid var(--red);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
  box-shadow: 0 4px 16px rgba(42, 33, 28, 0.08);
}
.brand .logo-circle img{
  width: 72%; height: auto; display: block;
}
.brand h1{
  font-family: 'Playfair Display', serif; font-weight: 900;
  font-size: 1.6rem; color: var(--ink); margin: 0 0 6px;
  letter-spacing: -0.01em;
}
.brand .bio{
  font-family: 'IBM Plex Mono', monospace;
  font-size: 0.82rem;
  line-height: 1.55;
  color: var(--ink);
  margin: 10px auto 0;
  max-width: 320px;
}

/* Social icons */
.socials{
  display: flex; justify-content: center; gap: 14px;
  margin: 18px 0 30px;
}
.socials a{
  width: 46px; height: 46px;
  display: flex; align-items: center; justify-content: center;
  background: var(--red);
  border: none;
  color: var(--paper);
  border-radius: 50%;
  transition: transform 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
  box-shadow: 0 2px 8px rgba(227, 21, 26, 0.25);
}
.socials a:hover,
.socials a:focus-visible{
  background: var(--red-dark);
  transform: translateY(-3px);
  box-shadow: 0 6px 14px rgba(227, 21, 26, 0.4);
  outline: none;
}
.socials a svg{ width: 22px; height: 22px; display: block; }

/* Buttons stack */
.links{
  display: flex; flex-direction: column; gap: 12px;
  margin-bottom: 32px;
}
.link-btn{
  display: block;
  width: 100%;
  padding: 20px 16px;
  background: var(--red);
  border: none;
  border-radius: 12px;
  color: #fff;
  text-decoration: none;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 0.92rem; font-weight: 700;
  letter-spacing: 0.06em;
  text-align: center;
  text-transform: uppercase;
  transition: transform 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
  box-shadow: 0 2px 8px rgba(227, 21, 26, 0.18);
}
.link-btn:hover,
.link-btn:focus-visible{
  background: var(--red-dark);
  transform: translateY(-2px);
  box-shadow: 0 6px 16px rgba(227, 21, 26, 0.35);
  outline: none;
}
.link-btn:active{ transform: translateY(0); }

/* Footer */
.foot{
  text-align: center; margin-top: auto;
  padding: 24px 0 8px;
  font-size: 0.7rem; color: var(--ink-dim);
  font-family: 'IBM Plex Mono', monospace;
}
.foot a{ color: var(--ink-dim); text-decoration: none; margin: 0 6px; }
.foot a:hover{ color: var(--red); }

/* Vichy stripe bottom */
.vichy-bottom{
  height: 10px;
  background-image: repeating-linear-gradient(
    45deg,
    var(--red) 0,
    var(--red) 8px,
    var(--paper) 8px,
    var(--paper) 16px
  );
}

@media (max-width: 380px){
  .wrap{ padding: 28px 18px 20px; }
  .link-btn{ padding: 16px 16px; font-size: 0.86rem; }
  .brand h1{ font-size: 1.4rem; }
}
